name: Regenerate npm lockfile

on:
  push:
    branches:
      - agent/add-npm-build
    paths:
      - package.json
      - .github/workflows/regenerate-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-npm-build
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "Update npm lockfile for web dependencies"
            git push origin HEAD:agent/add-npm-build
          fi
