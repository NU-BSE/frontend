<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="801 734 4290 4290" fill="none">
 <!--
   Tintable mascot.

   Colour comes from `currentColor`, so the `color` prop drives it (white on
   the Ask Creepy pill, brand blue in onboarding). The Corel export declared
   its strokes as `#332D2B` inside a <style> CSS block; react-native-svg does
   not apply CSS class rules, so the classes were inert and the strokes fell
   back to dark. Every paint is now an inline attribute.

   The viewBox is cropped to the artwork's bounding box — the head plus half
   its 250-unit stroke — instead of the exported 6000x6000 canvas, which
   padded roughly 15% of dead space on every side and made the glyph render
   noticeably smaller than its declared size.
 -->
 <g fill="none" stroke="currentColor" stroke-miterlimit="22.9256">
  <g stroke-width="250">
   <path d="M1009.18 4211.94c0,-455.63 226.44,-825 505.78,-825 279.33,0 505.77,369.37 505.77,825 0,14.4 -0.22,28.8 -0.69,43.18"/>
   <path d="M2042.26 4257.52c40.36,-394.29 239.24,-681.74 471.67,-681.74 235.58,0 436.19,295.13 473.04,695.94"/>
   <path d="M2990.64 4292.44c19.51,-401.65 193.8,-702.44 411.01,-709.28 214.29,-6.75 408.03,274.77 459.48,667.66"/>
   <path d="M3860.46 4293.94c-0.47,-14.38 -0.69,-28.78 -0.69,-43.18 0,-455.63 226.44,-825 505.77,-825 279.34,0 505.78,369.37 505.78,825"/>
   <rect x="3742.86" y="1691.7" width="400" height="400" rx="100" ry="100"/>
   <rect x="1757.56" y="1728.46" width="400" height="400" rx="100" ry="100"/>
   <rect x="946.07" y="879.61" width="4000" height="4000" rx="1000" ry="836.74"/>
  </g>
  <path stroke-width="150" fill-rule="nonzero" d="M3232.4 2148.37l2.76 1015.45 -269.67 -240.1 -123.43 284.57 -126.53 -67.28 123.08 -271.89 -0.22 -0.11 -372.73 -50.22 766.74 -670.42zm-140.52 292.19l-335.35 296.32 288.1 108.1 47.25 32.4 0 -436.82z"/>
 </g>
</svg>
